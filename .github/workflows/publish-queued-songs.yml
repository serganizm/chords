name: Publish queued songs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-queued-songs.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-queued-songs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Get OIDC token
        id: oidc
        run: |
          audience='https://chords-api.serganizm.workers.dev'
          encoded=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["AUD"], safe=""))')
          payload=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}")
          python3 -c 'import json,sys; json.load(sys.stdin)["value"]' <<<"$payload" >/dev/null
          token=$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          printf '%s' "$token" > oidc.token
        env:
          AUD: https://chords-api.serganizm.workers.dev

      - name: Fetch queued songs
        run: |
          curl -sS -f -H "Authorization: Bearer $(cat oidc.token)" \
            https://chords-api.serganizm.workers.dev/pending > queue.json
          python3 - <<'PY'
          import json
          data = json.load(open("queue.json"))
          if "error" in data:
              raise SystemExit(data["error"])
          songs = data.get("songs") or []
          print(f"queued={len(songs)}")
          open("queue.count", "w").write(str(len(songs)))
          PY

      - name: Write songs and push
        run: |
          count=$(cat queue.count)
          if [ "$count" = "0" ]; then
            echo "Queue is empty"
            exit 0
          fi
          python3 - <<'PY'
          import json, pathlib
          data = json.load(open("queue.json"))
          keys = []
          for song in data.get("songs") or []:
              path = song["path"]
              if not path.startswith("songs/") or ".." in path:
                  raise SystemExit(f"bad path {path}")
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              text = song["text"]
              if not text.endswith("\n"):
                  text += "\n"
              pathlib.Path(path).write_text(text, encoding="utf-8")
              keys.append(song["key"])
          json.dump({"keys": keys}, open("ack.json", "w"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs
          if git diff --cached --quiet; then
            echo "No file changes"
          else
            git commit -m "Publish queued songs from the site"
            git push
          fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer $(cat oidc.token)" \
            -H "Content-Type: application/json" \
            --data @ack.json \
            https://chords-api.serganizm.workers.dev/pending
